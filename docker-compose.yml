services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artvault
      POSTGRES_USER: artvault
      POSTGRES_PASSWORD: artvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artvault -d artvault"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:3v4yVQ0zL2ZxQmJ6TnJ5Rk9Pc1VwWmFhR0hGd0hYd1E=}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: artvault
      DB_USERNAME: artvault
      DB_PASSWORD: artvault
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

  backend-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend-web

volumes:
  postgres_data:

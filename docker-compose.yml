services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stematelart-backend
    working_dir: /app
    expose:
      - "9000"
    volumes:
      - ./Backend/app:/app/app
      - ./Backend/config:/app/config
      - ./Backend/routes:/app/routes
      - ./Backend/resources:/app/resources
      - ./Backend/database:/app/database
      - backend-storage:/app/storage
    environment:
      - APP_NAME=StematelArt
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/database/database.sqlite
    command: php-fpm
    networks:
      - stematelart-network

  nginx:
    image: nginx:alpine
    container_name: stematelart-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Backend/public:/app/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - stematelart-network

volumes:
  backend-storage:

networks:
  stematelart-network:
    driver: bridge
